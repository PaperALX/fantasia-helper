<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fantasia Helper</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="background/favicon.png">
</head>
<body>
  <div class="container">
    <div class="also-check-out">
      <span class="also-label">Also check out:</span>
      <a href="https://fantasiahelper.com/AccuracyCalculator/" target="_blank" rel="noopener">Accuracy Calculator</a>
      <a href="https://fantasialib.com/" target="_blank" rel="noopener">Fantasialib</a>
      <a href="https://fantasiastats.win/" target="_blank" rel="noopener">FantasiaStats</a>
      <a href="https://fantasiahelper.com/GPQstage3/" target="_blank" rel="noopener">GPQ Solver</a>
    </div>
    <h1 class="header-with-images">
      <img alt="" class="header-icon">
      <div class="h1-container">Fantasia Helper</div>
      <img alt="" class="header-icon">
    </h1>
    <div class="search-area">
      <input
        type="text"
        id="search"
        placeholder="Type monster or item name..."
        autocomplete="off"
      >
      <ul id="dropdown" class="dropdown"></ul>
    </div>
    <button id="backButton" class="back-button">← Go Back</button>
    <div id="result" class="result"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
